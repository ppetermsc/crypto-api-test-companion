# Включаем DEBUG для наших логгеров
org.slf4j.simpleLogger.defaultLogLevel=DEBUG
org.slf4j.simpleLogger.log.listeners.TestListener=INFO
org.slf4j.simpleLogger.log.tests=INFO
org.slf4j.simpleLogger.log.clients=DEBUG

# Формат вывода
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# Уменьшаем шум от внешних библиотек
org.slf4j.simpleLogger.log.io.restassured=WARN
org.slf4j.simpleLogger.log.org.testng=WARN
org.slf4j.simpleLogger.log.org.apache=WARN
org.slf4j.simpleLogger.log.ch.qos.logback=OFF
