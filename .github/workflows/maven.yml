name: Crypto API Test Companion CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Увеличиваем таймаут для долгих тестов

    strategy:
      matrix:
        java: [ '11', '17' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4  # ОБНОВЛЕНО: с v3 на v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and test with rate limiting
        run: |
          # Передаем параметры rate limiting как системные свойства
          mvn clean test -B \
            -Dbinance.rate.limit.delay=8000 \
            -Dcoingecko.rate.limit.delay=30000 \
            -Dallure.results.directory=target/allure-results
        env:
          MAVEN_OPTS: >
            -Dhttp.keepAlive=false
            -Dmaven.wagon.http.pool=false
            -Dmaven.wagon.http.retryHandler.count=3

      - name: Generate Allure Report
        if: always()
        run: |
          # Генерируем отчёт по данным, собранным на предыдущем шаге
          mvn allure:report -Dallure.results.directory=target/allure-results

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4  # ОБНОВЛЕНО: с v3 на v4
        with:
          name: allure-report-java-${{ matrix.java }}
          path: target/site/allure-maven/  # Явно указываем известный путь к отчёту
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4  # ОБНОВЛЕНО: с v3 на v4
        with:
          name: test-results-java-${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7